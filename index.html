<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d0f" />
  <title>Form Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><h1>Form Checker</h1><p>Real-time workout form feedback using your webcam</p></header>
  <main>
    <section class="stage">
      <div class="video-wrap">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="status">Click Start to turn on your camera</div>
      </div>
      <div class="controls">
        <select id="exercise">
          <option value="squat">Squat</option>
          <option value="pushup">Push-up</option>
          <option value="lunge">Lunge</option>
          <option value="bulgarian">Bulgarian split squat</option>
          <option value="glutebridge">Glute bridge</option>
          <option value="pullup">Pull-up</option>
          <option value="pikepushup">Pike push-up</option>
          <option value="plank">Plank</option>
          <option value="reversecrunch">Reverse crunch</option>
          <option value="jumpingjack">Jumping jack</option>
          <option value="curl">Bicep curl</option>
        </select>
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop &amp; save</button>
        <button id="soundBtn" type="button">🔊 Sound on</button>
        <button id="roastBtn" type="button">😈 Roast on</button>
      </div>
    </section>
    <aside>
      <div class="stats">
        <div class="card"><h2>Reps</h2><div id="reps" class="big">0</div></div>
        <div class="card"><h2>Form</h2><div id="score" class="big">--</div></div>
      </div>
      <div class="card"><h2>Feedback</h2><ul id="feedback"><li>Stand so your whole body is visible, side-on to the camera.</li></ul></div>
      <div class="card" id="routineCard">
        <h2>Daily routine</h2>
        <select id="routineSelect"></select>
        <div class="row">
          <button id="runRoutine" type="button">Run</button>
          <button id="editRoutine" type="button">New</button>
          <button id="delRoutine" type="button">Delete</button>
        </div>
        <div id="editor" hidden>
          <input id="rName" type="text" placeholder="Routine name (e.g. Leg day)" maxlength="40" />
          <div id="rDays"></div>
          <div id="rRows"></div>
          <div class="row"><button id="addRow" type="button">+ Exercise</button><button id="saveRoutine" type="button">Save routine</button></div>
        </div>
        <ul id="routineProgress"></ul>
      </div>
      <div class="card"><h2>Recent sessions</h2><ul id="history"></ul></div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
